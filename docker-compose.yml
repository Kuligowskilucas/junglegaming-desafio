name: wagering-processor

x-app-network-environment: &app-network-environment
  DB_HOST: postgres
  DB_PORT: "5432"
  SQS_ENDPOINT: http://sqs:4566

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?copie .env.example para .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?copie .env.example para .env}
      POSTGRES_DB: ${DB_NAME:?copie .env.example para .env}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30

  sqs:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs
      SQS_ENDPOINT_STRATEGY: path
      AWS_DEFAULT_REGION: ${AWS_REGION:?copie .env.example para .env}
      SQS_WAGER_QUEUE_NAME: ${SQS_WAGER_QUEUE_NAME:?copie .env.example para .env}
      SQS_WAGER_DLQ_NAME: ${SQS_WAGER_DLQ_NAME:?copie .env.example para .env}
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-10}
      SQS_EVENTS_QUEUE_NAME: ${SQS_EVENTS_QUEUE_NAME:-wager-events.fifo}
    ports:
      - "4566:4566"
    volumes:
      - ./docker/sqs/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name \"$${SQS_EVENTS_QUEUE_NAME}\""]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  migrate:
    build: .
    image: wagering-processor:local
    profiles: ["app"]
    command: ["bun", "src/migrate.ts"]
    env_file: .env
    environment: *app-network-environment
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    image: wagering-processor:local
    profiles: ["app"]
    env_file: .env
    environment:
      <<: *app-network-environment
      HTTP_PORT: "3000"
    deploy:
      replicas: ${APP_REPLICAS:-3}
    ports:
      - "${APP_PORTS:-3001-3003}:3000"
    init: true
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/ready > /dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      sqs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
